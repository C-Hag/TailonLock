<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: an editing suite. Bar on top, scene list left, the 16:9 viewfinder centre, inspector right, timeline along the bottom. */
:root {
  color-scheme: dark;
  --bg: #11141a; --panel: #181c24; --raise: #212734; --line: #2c3342; --ink: #e6e9ef; --dim: #8e97a8;
  --accent: #f2a774; --accent-ink: #1a1208; --blue: #7aa8ff; --red: #ff7a5c; --ok: #8fd18a; --warn: #ffd25a;
  --f-ui: "Barlow", "Helvetica Neue", Arial, sans-serif; --f-head: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
  --f-num: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 13px/1.35 var(--f-ui); overflow: hidden; }
#app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
button, select, input, textarea { font: inherit; color: var(--ink); }
button { background: var(--raise); border: 1px solid var(--line); border-radius: 4px; padding: 4px 9px; cursor: pointer; white-space: nowrap; }
button:hover { border-color: var(--dim); }
button.on, button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
select, input[type=text], input[type=number], textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; min-width: 0; }
input[type=number] { font-family: var(--f-num); font-size: 12px; }
textarea { width: 100%; resize: vertical; min-height: 64px; }
label { color: var(--dim); }
h2 { font: 600 12px/1 var(--f-head); letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); margin: 0; }
/* top bar */
#bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
#bar .brand { font: 700 15px/1 var(--f-head); letter-spacing: 0.06em; text-transform: uppercase; margin-right: 6px; }
#bar .brand small { color: var(--accent); font-weight: 600; }
#bar .grp { display: flex; gap: 4px; align-items: center; }
#bar .sep { width: 1px; align-self: stretch; background: var(--line); }
#clock { font: 500 13px var(--f-num); min-width: 12ch; text-align: right; font-variant-numeric: tabular-nums; }
#barno { font: 12px var(--f-num); color: var(--dim); min-width: 9ch; }
#bar .grow { flex: 1; }
/* middle */
#mid { display: grid; grid-template-columns: 220px 1fr 280px; min-height: 0; }
#left, #right { background: var(--panel); overflow: auto; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding: 10px; }
#left { border-right: 1px solid var(--line); }
#right { border-left: 1px solid var(--line); }
#insp { display: flex; flex-direction: column; gap: 10px; }
#insp p { margin: 0 0 8px; }
.list { display: flex; flex-direction: column; gap: 1px; margin-top: 6px; }
.item { display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 3px; cursor: pointer; }
.item:hover { background: var(--raise); }
.item.sel { background: color-mix(in srgb, var(--accent) 22%, transparent); }
.item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .meta { font: 11px var(--f-num); color: var(--dim); }
.item .eye { background: none; border: 0; padding: 0 2px; color: var(--dim); font-size: 12px; }
.item.off .nm { color: var(--dim); text-decoration: line-through; }
.dot { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.row > select { flex: 1; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px 6px; }
.grid3 label, .field label { display: block; font-size: 11px; margin-bottom: 2px; }
.grid3 input { width: 100%; }
.field { display: flex; flex-direction: column; gap: 2px; }
.field input[type=text] { width: 100%; }
.hint { color: var(--dim); font-size: 12px; }
.hint kbd { font: 11px var(--f-num); background: var(--raise); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; color: var(--ink); }
.keys { font: 11px var(--f-num); color: var(--dim); }
/* stage */
#stagewrap { position: relative; min-width: 0; min-height: 0; display: grid; place-items: center; background: #07090c; }
#stage { position: relative; aspect-ratio: 16 / 9; max-width: 100%; max-height: 100%; width: 100%; overflow: hidden; }
#stage canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
.lb { position: absolute; left: 0; right: 0; background: rgba(0, 0, 0, 0.82); pointer-events: none; height: 12.2%; }
.lb.t { top: 0; } .lb.b { bottom: 0; }
#osd { position: absolute; left: 10px; top: 8px; font: 12px var(--f-num); color: #fff; text-shadow: 0 1px 2px #000; pointer-events: none; white-space: pre; }
#osd2 { position: absolute; right: 10px; top: 8px; font: 12px var(--f-num); color: var(--warn); text-shadow: 0 1px 2px #000; pointer-events: none; text-align: right; white-space: pre; }
/* timeline */
#tl { background: var(--panel); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
#tl canvas { display: block; width: 100%; height: 152px; cursor: default; }
#toast { position: fixed; left: 50%; bottom: 170px; transform: translateX(-50%); background: var(--raise); border: 1px solid var(--accent); padding: 8px 14px; border-radius: 6px; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 5; max-width: 80vw; }
#toast.show { opacity: 1; }
#loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); font: 600 14px var(--f-head); letter-spacing: 0.1em; text-transform: uppercase; }
#export { position: fixed; inset: 10% 15%; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 8px; z-index: 6; }
#export textarea { flex: 1; font: 11px var(--f-num); }
@media (max-width: 900px) {
  #mid { grid-template-columns: 1fr; grid-template-rows: auto minmax(200px, 1fr) auto; overflow: auto; }
  #left, #right { max-height: 30vh; }
  body { overflow: auto; }
}
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>

<script>
window.SB_MODELS = /*__MODELS__*/null;
window.SB_INTRO = /*__SCRIPT__*/null;

<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { TransformControls } from 'three/addons/controls/TransformControls.js';

// ---------------------------------------------------------------- data
// Game coordinates: x east (right), y up, z north (forward); yaw clockwise from +z, pitch nose up, roll right wing
// down (IntroCore.frame). three.js is right-handed the other way round, so the scene is shown mirrored in x:
// three = (-x, y, z), and a rotation R becomes M R M with M = diag(-1, 1, 1). Everything stored is in game terms.
const IC = IntroCore, D2R = Math.PI / 180;
const MODELS = window.SB_MODELS.models, ENV = window.SB_MODELS.env, INTRO = window.SB_INTRO;
const CUES = INTRO.music.cues, BAR = CUES.bar, HIT = CUES.band_hit;
const CARRIER = INTRO.actors.find(a => a.id === 'carrier').ship;
const DUR = Math.max(INTRO.duration, 70);
const STORE = 'tailonlock-storyboard-1';
const add3 = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]], mul3 = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
const sub3 = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]], dot3 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const r2 = v => Math.round(v * 100) / 100, r3 = v => Math.round(v * 1000) / 1000;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lensOf = fov => 12 / Math.tan(fov * D2R / 2), fovOf = mm => 2 * Math.atan(12 / mm) / D2R;
const unwrap = (a, ref) => { while (a - ref > 180) a -= 360; while (a - ref < -180) a += 360; return a; };

let doc = blankDoc();
function blankDoc() { return { format: 'tailonlock-storyboard', version: 1, title: 'Storyboard', objects: [], shots: [], hidden: [], introShotsInFilm: true }; }

// ---------------------------------------------------------------- frames
// pose: { p, r, u, f } in game coordinates
function poseFromAngles(p, yaw, pitch, roll) { const fr = IC.frame(yaw, pitch, roll); return { p, r: fr.r, u: fr.u, f: fr.f }; }
function anglesOf(P) { return IC.angles(P.f, P.u); }
// world pose of a local one carried by a frame (actor axes)
function compose(A, L) {
  const W = v => add3(add3(mul3(A.r, v[0]), mul3(A.u, v[1])), mul3(A.f, v[2]));
  return { p: add3(A.p, W(L.p)), r: W(L.r), u: W(L.u), f: W(L.f) };
}
function relative(A, P) {
  const T = v => [dot3(A.r, v), dot3(A.u, v), dot3(A.f, v)];
  return { p: T(sub3(P.p, A.p)), r: T(P.r), u: T(P.u), f: T(P.f) };
}
function carrierFrame(t) { const p = IC.shipPos(CARRIER, t); return poseFromAngles(p, CARRIER.heading, 0, 0); }

// ---------------------------------------------------------------- three.js scene
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
stage.prepend(renderer.domElement);
const camera = new THREE.PerspectiveCamera(50, 16 / 9, 0.05, 90000);
const world = new THREE.Scene(), room = new THREE.Scene();
const TOD = ENV.tod;
const MAT = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide, flatShading: true });
const M3 = v => new THREE.Vector3(-v[0], v[1], v[2]);

function geometryOf(m, recolor) {
  const pos = [], col = [], c = new THREE.Color();
  m.f.forEach(([idx, hex], fi) => {
    c.set(recolor && recolor(fi) || hex);
    for (let k = 1; k + 1 < idx.length; k++) for (const i of [idx[0], idx[k], idx[k + 1]]) { const v = m.v[i]; pos.push(-v[0], v[1], v[2]); col.push(c.r, c.g, c.b); }
  });
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.computeVertexNormals(); g.computeBoundingSphere();
  return g;
}
const GEO = {};
function meshOf(model, jersey) {
  const key = model + (jersey || '');
  if (!GEO[key]) {
    const m = MODELS[model]; if (!m) return null;
    const js = jersey && m.jersey ? new Set(m.jersey) : null;
    GEO[key] = geometryOf(m, js ? fi => js.has(fi) ? jersey : null : null);
  }
  return new THREE.Mesh(GEO[key], MAT);
}

function buildWorld() {
  const top = new THREE.Color(TOD.sky_top), hor = new THREE.Color(TOD.sky_horizon), fog = new THREE.Color(TOD.fog);
  world.background = hor.clone();
  world.fog = new THREE.FogExp2(fog, 1 / 16000);
  // sky dome: the horizon glow up to the dawn blue, the sun's glow toward env.sun
  const sun = ENV.sun, sunV = M3(sun).normalize();
  const sky = new THREE.Mesh(new THREE.SphereGeometry(80000, 48, 24), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { top: { value: top }, hor: { value: hor }, sun: { value: sunV }, glow: { value: new THREE.Color('#ffd9a8') } },
    vertexShader: 'varying vec3 d; void main(){ d = normalize(position); vec4 p = modelViewMatrix * vec4(position,1.0); gl_Position = projectionMatrix * p; }',
    fragmentShader: 'uniform vec3 top, hor, sun, glow; varying vec3 d; void main(){ float h = clamp(d.y, 0.0, 1.0); vec3 c = mix(hor, top, pow(h, 0.55)); float s = max(dot(d, sun), 0.0); c += glow * (pow(s, 600.0) * 2.5 + pow(s, 12.0) * 0.35); if (d.y < 0.0) c = hor * 0.9; gl_FragColor = vec4(c, 1.0);\n#include <colorspace_fragment>\n}'
  }));
  sky.frustumCulled = false; sky.renderOrder = -1; sky.name = 'sky';
  world.add(sky);
  world.userData.sky = sky;
  world.add(new THREE.HemisphereLight(new THREE.Color(TOD.ambient), new THREE.Color(TOD.water_tint).multiplyScalar(0.5), 1.4 * TOD.ambient_intensity));
  const dl = new THREE.DirectionalLight(new THREE.Color(TOD.sun_color), 2.2 * TOD.sun_intensity);
  dl.position.copy(sunV).multiplyScalar(1000); world.add(dl);
  // the sea
  const sea = new THREE.Mesh(new THREE.PlaneGeometry(200000, 200000), new THREE.MeshLambertMaterial({ color: new THREE.Color('#3f6f9a').lerp(new THREE.Color(TOD.water_tint), 0.22), emissive: new THREE.Color('#1c2c44') }));
  sea.rotation.x = -Math.PI / 2; sea.name = 'sea'; world.add(sea);
  // Twin Isles: the terrain grid, land only
  const T = ENV.terrain, n = T.n, sp = T.spacing, o = T.origin, pos = [], col = [], c = new THREE.Color();
  const hgt = (i, j) => T.h[j * n + i];
  for (let j = 0; j < n - 1; j++) for (let i = 0; i < n - 1; i++) {
    const q = [[i, j], [i + 1, j], [i + 1, j + 1], [i, j + 1]].map(([a, b]) => [o[0] + a * sp, hgt(a, b), o[1] + b * sp]);
    if (Math.max(...q.map(v => v[1])) < 1) continue;
    const pal = T.palette[T.mat[j * (n - 1) + i]] || T.palette[0];
    c.set(pal.water ? '#c8b98a' : pal.color);
    for (const tri of [[0, 1, 2], [0, 2, 3]]) for (const k of tri) { const v = q[k]; pos.push(-v[0], Math.max(v[1], -3), v[2]); col.push(c.r, c.g, c.b); }
  }
  const tg = new THREE.BufferGeometry();
  tg.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); tg.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); tg.computeVertexNormals();
  world.add(new THREE.Mesh(tg, MAT));
  // clouds: soft puffs, the map's plus the intro's extra cumulus, without the cleared ones
  const cleared = cl => ENV.clear_clouds.some(cc => Math.hypot(cl.x - cc[0], cl.z - cc[1]) < cc[2]);
  const puffs = [];
  for (const cl of ENV.clouds) if (!cleared(cl)) for (const p of cl.puffs) puffs.push([cl.x + p[0], cl.base + p[1], cl.z + p[2], p[3]]);
  const im = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 2), new THREE.MeshLambertMaterial({ color: '#f3dccd', emissive: '#4a3c4c', transparent: true, opacity: 0.9 }), puffs.length);
  const mt = new THREE.Matrix4();
  puffs.forEach((p, i) => { mt.makeScale(p[3], p[3] * 0.8, p[3]); mt.setPosition(-p[0], p[1], p[2]); im.setMatrixAt(i, mt); });
  world.add(im);
}
function buildRoom() {
  room.background = new THREE.Color('#0b0d10');
  room.add(new THREE.AmbientLight('#9aa0b0', 1.1));
  for (const [x, y, z, c] of [[0.6, 2.4, 2, '#ffe2b8'], [-2.5, 2.4, 1, '#ffd6a0'], [3.5, 2.4, 1, '#ffd6a0']]) { const l = new THREE.PointLight(c, 9, 12, 1.5); l.position.copy(M3([x, y, z])); room.add(l); }
  room.add(meshOf('room'));
  const sm = new THREE.MeshBasicMaterial({ color: '#2f7a52', side: THREE.DoubleSide });
  for (const s of MODELS.room.screens) {
    const a = s.o, b = add3(s.o, s.ex), c = add3(b, s.ey), d = add3(s.o, s.ey), g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute([a, b, c, a, c, d].flatMap(v => [-v[0], v[1], v[2] - 0.003]), 3));
    room.add(new THREE.Mesh(g, sm));
  }
}

// ---------------------------------------------------------------- the cast
// Each thing on stage: { id, src: 'intro' | 'mine', scene: 'world' | 'cic', node, pose(t) -> pose | null }
const things = new Map();
function placeNode(node, P) {
  node.position.copy(M3(P.p));
  const m = new THREE.Matrix4().makeBasis(new THREE.Vector3(P.r[0], -P.r[1], -P.r[2]), M3(P.u), M3(P.f));
  node.quaternion.setFromRotationMatrix(m);
}
function poseOfNode(node) {
  const m = new THREE.Matrix4().makeRotationFromQuaternion(node.quaternion), e = m.elements;
  const c0 = [e[0], e[1], e[2]], c1 = [e[4], e[5], e[6]], c2 = [e[8], e[9], e[10]];
  return { p: [-node.position.x, node.position.y, node.position.z], r: [c0[0], -c0[1], -c0[2]], u: [-c1[0], c1[1], c1[2]], f: [-c2[0], c2[1], c2[2]] };
}
const ACT = Object.fromEntries(INTRO.actors.map(a => [a.id, a]));
for (const a of INTRO.actors) if (a.keys && a.keys.length) a.tr = IC.track(a.keys);
const SHOTS = INTRO.shots.map(s => Object.assign({}, s, { tr: IC.track(s.cam) }));
// the intro's own actors, as the intro plays them (assets/intro/src/intro.js actorFrame)
function introPose(a, t) {
  if (a.kind === 'ship') return poseFromAngles(IC.shipPos(a.ship, t), a.ship.heading, 0, 0);
  if (a.kind === 'static') { const sh = ACT[a.attach].ship; return poseFromAngles(IC.shipLocal(sh, t, a.pos), sh.heading + a.heading, 0, 0); }
  if (!a.tr) return null;
  if (a.kind === 'crew') {
    const k = IC.sample(a.tr, clamp(t, a.keys[0][0], a.keys[a.keys.length - 1][0]), []); if (!k) return null;
    const sh = ACT[a.attach].ship; return poseFromAngles(IC.shipLocal(sh, t, [k[1], k[2], k[3]]), sh.heading + k[4], 0, 0);
  }
  if (a.spawn != null && t < a.spawn) return null;
  if (a.end != null && t > a.end) return null;
  const s = IC.sample(a.tr, t, []); if (!s) return null;
  return poseFromAngles([s[1], s[2], s[3]], s[4], s[5], s[6]);

// my objects: keys [t, x, y, z, yaw, pitch, roll], held before the first and after the last; carrier-borne ones are
